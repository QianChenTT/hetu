name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the automatic GITHUB_TOKEN: default read-only, job request more on the fly
permissions:
  contents: read

jobs:
  # The tests and the typecheck of every workspace. Windows too, since it is hetu's main target
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      # Tests that make a git repo of their own commit with the machine's git identity and a fresh runner has none
      GIT_AUTHOR_NAME: hetu-ci
      GIT_AUTHOR_EMAIL: ci@hetu.invalid
      GIT_COMMITTER_NAME: hetu-ci
      GIT_COMMITTER_EMAIL: ci@hetu.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Install scripts are skipped. Electron's fetches its binary, which only the end-to-end job needs
      - name: install packages
        run: npm ci --ignore-scripts
      - name: typecheck
        run: npm run typecheck
      # A runner's volumes may make no 8.3 short names, and the canonicaliser's tests need them to prove that a short
      # name like GIT~1 can't reach .git. The probe folder fails the step if it gets no short name of its own
      - name: turn on 8.3 short names
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          fsutil behavior set disable8dot3 2
          fsutil 8dot3name set C: 0
          fsutil 8dot3name set D: 0
          $dir = Join-Path $env:TEMP 'short-name-probe-folder'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($dir).ShortName
          if ($short -notmatch '~') { throw "no 8.3 short name was made for $dir" }
          Write-Output "short name: $short"
      - name: run tests
        run: npm test
      # Every block of 4 lines or more repeated in shipped code, found by jscpd, must be in core/test/copies-allowed.json
      # for a person to judge. jscpd is a prebuilt binary npm picks per system, with no install script
      - name: check copies
        run: npm run check:copies

  # The built app on both systems, driven by Playwright
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: install packages
        run: npm ci --ignore-scripts
      # The one install script run: Electron's, which fetches its binary and checks it against the checksums its package
      # ships, the package itself pinned by the lock file
      - name: fetch Electron
        run: node node_modules/electron/install.js
      - name: build and drive the app
        run: npm run test:e2e

  # The packed build on both systems: the folder build and its packaged suite, then the end-to-end tests driving a
  # packed build that isn't locked. Windows also builds the setup, installs it silently for the runner's account, runs
  # the installed checks against %LOCALAPPDATA%\Programs\hetu and uninstalls it. The runner is elevated, which a
  # person's shell isn't
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # A green run took up to 12.5 min on Windows and 11 min on macOS. A run that hung sat until cancelled
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: install packages
        run: npm ci --ignore-scripts
      - name: fetch Electron
        run: node node_modules/electron/install.js
      - name: pack the folder build
        run: npm run package:dir
      - name: packaged suite
        run: npm run test:packaged -w hetu-core
      - name: drive the packed build
        run: npm run test:e2e:packaged
      - name: build the setup
        if: runner.os == 'Windows'
        run: npm run package
      # Ends at 10 min, with a line before and after each phase naming the phase it stopped in. The setup and the
      # uninstaller refuse /allusers with exit code 740, as they refuse any step that asks for administrator rights. The
      # second run of the setup is an update over the first
      - name: install, check, update and uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-package/installer/hetu-setup-*-x64.exe | Select-Object -First 1
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\hetu'
          $guid = node -e "import('./core/build/package.ts').then(m => console.log(m.INSTALL_GUID))"
          if ($guid -notmatch '^[0-9a-f-]{36}$') { throw "no install id read: $guid" }
          $made = @(
            $dir,
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$guid",
            "HKCU:\Software\$guid",
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\hetu.lnk')
          )
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) 'hetu.lnk'
          # Each process of the setup, the uninstaller or hetu with its command line and the text of its windows, so a phase
          # that hangs shows what it waits on, a message box among them. NSIS keeps no log of its own
          function Show-Waiting {
            Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class WindowTexts {
            delegate bool Visit(IntPtr window, IntPtr data);
            [DllImport("user32.dll")] static extern bool EnumWindows(Visit visit, IntPtr data);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr parent, Visit visit, IntPtr data);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr window, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern IntPtr SendMessageTimeout(IntPtr window, uint message, IntPtr wide, StringBuilder text, uint flags, uint ms, out IntPtr result);
            static string Text(IntPtr window) {
              var text = new StringBuilder(2048);
              IntPtr result;
              SendMessageTimeout(window, 0x000D, (IntPtr)text.Capacity, text, 2, 2000, out result);
              return text.ToString();
            }
            public static List<string> Of(uint pid) {
              var lines = new List<string>();
              EnumWindows((window, data) => {
                uint owner;
                GetWindowThreadProcessId(window, out owner);
                if (owner != pid) return true;
                lines.Add("window: " + Text(window));
                EnumChildWindows(window, (child, more) => { var text = Text(child); if (text.Length > 0) lines.Add("  " + text); return true; }, IntPtr.Zero);
                return true;
              }, IntPtr.Zero);
              return lines;
            }
          }
          '@
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'hetu|uninstall|^Un_|^Au_' } | ForEach-Object {
              Write-Host "process $($_.ProcessId), parent $($_.ParentProcessId): $($_.CommandLine)"
              foreach ($line in [WindowTexts]::Of([uint32] $_.ProcessId)) { Write-Host "  $line" }
            }
          }
          # Each phase ends within its own time limit, the waiting processes shown when it doesn't
          function Invoke-Phase([string] $phase, [string] $file, [string[]] $arguments, [int] $expected) {
            Write-Host "$(Get-Date -Format o) $phase"
            $run = Start-Process $file -ArgumentList $arguments -PassThru
            # Holding the handle keeps the exit code readable once the process is gone
            $null = $run.Handle
            if (-not $run.WaitForExit(120000)) {
              Write-Host "$(Get-Date -Format o) $phase still running after 120 s"
              Show-Waiting
              throw "$phase timed out"
            }
            Write-Host "$(Get-Date -Format o) $phase ended with $($run.ExitCode)"
            if ($run.ExitCode -ne $expected) { throw "$phase ended with $($run.ExitCode), not $expected" }
          }
          Invoke-Phase "refused install: $($setup.Name) /S /allusers" $setup.FullName @('/S', '/allusers') 740
          if ((Test-Path $dir) -or (Test-Path (Join-Path $env:ProgramFiles 'hetu'))) { throw 'the refused install left a folder' }
          # /D= names another folder and the setup installs to its own all the same. .onInit's SetOutPath makes the folder
          # /D= names before the include's hook runs, so it may stay behind, empty
          $elsewhere = Join-Path $env:RUNNER_TEMP 'hetu-elsewhere'
          Invoke-Phase "install: $($setup.Name) /S /D=$elsewhere" $setup.FullName @('/S', "/D=$elsewhere") 0
          if (@(Get-ChildItem $elsewhere -Recurse -Force -ErrorAction SilentlyContinue).Count -gt 0) { throw "the install put files in $elsewhere" }
          if (-not (Test-Path (Join-Path $dir 'hetu.exe'))) { throw "the install isn't in $dir" }
          $env:HETU_INSTALLED = $dir
          $env:HETU_SETUP = $setup.FullName
          Write-Output "$(Get-Date -Format o) installed suite: starting"
          npm run test:installed -w hetu-core
          Write-Output "$(Get-Date -Format o) installed suite ended with $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw 'the installed checks failed' }
          # Run in place with _?=, so the exit code is the uninstaller's own and not that of the copy it starts from temp
          $uninstaller = Join-Path $dir 'Uninstall hetu.exe'
          Invoke-Phase 'refused uninstall: Uninstall hetu.exe /S /allusers' $uninstaller @('/S', '/allusers', "_?=$dir") 740
          if (-not (Test-Path (Join-Path $dir 'hetu.exe'))) { throw 'the refused uninstall removed hetu.exe' }
          # The same setup again is an update: the older uninstaller runs with --updated and keeps the desktop shortcut
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($desktopLink)
          $link.TargetPath = Join-Path $dir 'hetu.exe'
          $link.Save()
          # What the update's uninstall of the older version reads
          Write-Host "InstallLocation: $((Get-ItemProperty "HKCU:\Software\$guid").InstallLocation)"
          Write-Host "UninstallString: $((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$guid").UninstallString)"
          Invoke-Phase "update: $($setup.Name) /S" $setup.FullName @('/S') 0
          foreach ($path in $made + $desktopLink) { if (-not (Test-Path $path)) { throw "the update left no $path" } }
          Invoke-Phase 'uninstall: Uninstall hetu.exe /S' $uninstaller @('/S') 0
          # The uninstaller goes on from a copy in temp and removes the registry keys after the folder
          $deadline = (Get-Date).AddMinutes(1)
          while (($made + $desktopLink | Where-Object { Test-Path $_ }) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          $left = @($made + $desktopLink | Where-Object { Test-Path $_ })
          if ($left.Count -gt 0) {
            Show-Waiting
            throw "the uninstall left $($left -join ', ')"
          }
      - name: keep the setup, the update file and their hashes
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hetu-setup
          path: |
            dist-package/installer/hetu-setup-*-x64.exe
            dist-package/installer/hetu-update.json
            dist-package/installer/SHA256SUMS

  # SCA: dev dependencies and medium or lower advisories only warn, high and critical in
  # production dependencies fail
  sca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Report: every advisory at every severity, dev included. Never fails, a warning shows on the run
      - name: dependency report (all, dev included)
        run: npm audit || echo "::warning title=npm audit::advisories found, details in the dependency report step"
      # Gate policy: fail only on high or critical in production dependencies
      - name: dependency gate (production, high+)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all commits
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST: the repo's own source code against insecure patterns
  sast:
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b # 1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --error: any finding fails the job, --metrics=off: send no usage data to Semgrep
      - name: semgrep scan
        run: semgrep scan --config p/javascript --config p/typescript --error --metrics=off

  # SAST with data flow: CodeQL follows input from source to sink across files, which pattern
  # rules can't. Results land in the Security tab.
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
