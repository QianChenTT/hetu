name: Release

# By hand only: the Actions tab's Run workflow, or `gh workflow run release.yml --ref main`, with `-f ref=<commit>` to
# build a commit main holds in place of its tip. Builds the Windows setup and publishes it as a pre-release named after
# the version in that commit's package.json
on:
  workflow_dispatch:
    inputs:
      ref:
        description: A commit main holds, by hash or tag, to build in place of main's tip. Empty builds the tip
        required: false
        default: ''
        type: string

# Nothing by default. Each job asks for exactly what it needs
permissions: {}

# One release at a time, and a release under way is never cancelled half done
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The setup built, installed, checked and uninstalled on a fresh runner, then attested. Nothing is published here
  build:
    # Only main ships. A run started on another branch skips both jobs
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    permissions:
      contents: read # the checkout and whether the version's tag exists
      actions: read # the CI runs of this commit
      id-token: write # the OIDC token for the Sigstore certificate the attestation is signed with
      attestations: write # store the attestation
      artifact-metadata: write # the storage record actions/attest makes for the setup
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # All of main's history, so a named commit can be checked against it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # main's own check picks the commit: the tip, or the named one when main holds it. Everything after builds from it
      - name: pick the commit to build
        id: commit
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          MAIN: ${{ github.sha }}
        run: |
          commit=$(node scripts/release-commit.ts "$REF" "$MAIN")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          git checkout --quiet --detach "$commit"
      - name: read the version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::package.json's version $version isn't x.y.z"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A tag names one build forever, so a version already out is never built again
      - name: refuse a version already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::v$VERSION is already tagged. Raise the version in package.json first"
            exit 1
          fi
      # What ships is what CI passed: the tests, the end-to-end runs, the packaged suites and the scans, on both
      # systems, for this exact commit on main
      - name: require this commit's CI on main to have passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.commit }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$SHA" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI hasn't passed on main for $SHA. Wait for it or run it again first"
            exit 1
          fi
      - name: install packages
        run: npm ci --ignore-scripts
      # The one install script run: Electron's, which fetches its binary and checks it against the checksums its package
      # ships, the package itself pinned by the lock file
      - name: fetch Electron
        run: node node_modules/electron/install.js
      - name: build the setup
        run: npm run package
      - name: check the setup against its SHA256SUMS
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: dist-package/installer
        run: |
          test -f "hetu-setup-$VERSION-x64.exe"
          test "$(ls *.exe | wc -l)" -eq 1
          sha256sum -c SHA256SUMS
      # The setup that ships, installed silently for the runner's account as a person would, checked, updated over and
      # removed again. Ends at 10 min, with a line before and after each phase naming the phase it stopped in. The setup
      # and the uninstaller refuse /allusers with exit code 740, as they refuse any step that asks for administrator rights
      - name: install, check, update and uninstall
        timeout-minutes: 10
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = Get-Item "dist-package/installer/hetu-setup-$env:VERSION-x64.exe"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\hetu'
          $guid = node -e "import('./core/build/package.ts').then(m => console.log(m.INSTALL_GUID))"
          if ($guid -notmatch '^[0-9a-f-]{36}$') { throw "no install id read: $guid" }
          $made = @(
            $dir,
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$guid",
            "HKCU:\Software\$guid",
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\hetu.lnk')
          )
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) 'hetu.lnk'
          function Invoke-Phase([string] $phase, [string] $file, [string[]] $arguments, [int] $expected) {
            Write-Host "$(Get-Date -Format o) $phase"
            $run = Start-Process $file -ArgumentList $arguments -Wait -PassThru
            Write-Host "$(Get-Date -Format o) $phase ended with $($run.ExitCode)"
            if ($run.ExitCode -ne $expected) { throw "$phase ended with $($run.ExitCode), not $expected" }
          }
          Invoke-Phase "refused install: $($setup.Name) /S /allusers" $setup.FullName @('/S', '/allusers') 740
          if ((Test-Path $dir) -or (Test-Path (Join-Path $env:ProgramFiles 'hetu'))) { throw 'the refused install left a folder' }
          # /D= names another folder and the setup installs to its own all the same. .onInit's SetOutPath makes the folder
          # /D= names before the include's hook runs, so it may stay behind, empty
          $elsewhere = Join-Path $env:RUNNER_TEMP 'hetu-elsewhere'
          Invoke-Phase "install: $($setup.Name) /S /D=$elsewhere" $setup.FullName @('/S', "/D=$elsewhere") 0
          if (@(Get-ChildItem $elsewhere -Recurse -Force -ErrorAction SilentlyContinue).Count -gt 0) { throw "the install put files in $elsewhere" }
          if (-not (Test-Path (Join-Path $dir 'hetu.exe'))) { throw "the install isn't in $dir" }
          $env:HETU_INSTALLED = $dir
          $env:HETU_SETUP = $setup.FullName
          Write-Output "$(Get-Date -Format o) installed suite: starting"
          npm run test:installed -w hetu-core
          Write-Output "$(Get-Date -Format o) installed suite ended with $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw 'the installed checks failed' }
          # Run in place with _?=, so the exit code is the uninstaller's own and not that of the copy it starts from temp
          $uninstaller = Join-Path $dir 'Uninstall hetu.exe'
          Invoke-Phase 'refused uninstall: Uninstall hetu.exe /S /allusers' $uninstaller @('/S', '/allusers', "_?=$dir") 740
          if (-not (Test-Path (Join-Path $dir 'hetu.exe'))) { throw 'the refused uninstall removed hetu.exe' }
          # The same setup again is an update: the older uninstaller runs with --updated and keeps the desktop shortcut
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($desktopLink)
          $link.TargetPath = Join-Path $dir 'hetu.exe'
          $link.Save()
          Invoke-Phase "update: $($setup.Name) /S" $setup.FullName @('/S') 0
          foreach ($path in $made + $desktopLink) { if (-not (Test-Path $path)) { throw "the update left no $path" } }
          Invoke-Phase 'uninstall: Uninstall hetu.exe /S' $uninstaller @('/S') 0
          # The uninstaller goes on from a copy in temp and removes the registry keys after the folder
          $deadline = (Get-Date).AddMinutes(1)
          while (($made + $desktopLink | Where-Object { Test-Path $_ }) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          $left = @($made + $desktopLink | Where-Object { Test-Path $_ })
          if ($left.Count -gt 0) { throw "the uninstall left $($left -join ', ')" }
      # A signed record of which workflow built the setup from which commit, checked with gh attestation verify
      - name: attest the setup's build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-package/installer/hetu-setup-${{ steps.version.outputs.version }}-x64.exe
      - name: keep the setup and its hash for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hetu-release
          path: |
            dist-package/installer/hetu-setup-${{ steps.version.outputs.version }}-x64.exe
            dist-package/installer/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # The release made apart from the build, so the token that writes to the repo never meets npm or the build
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and its tag
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hetu-release
          path: release
      - name: check the files against SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS
      # Made as a draft with its files, then published, so nothing is missing once it is out. A draft left by a run
      # that failed after making it is removed first
      - name: publish the pre-release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.commit }}
        run: |
          tag="v$VERSION"
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then echo "::error::$tag is already released"; exit 1; fi
          if [ "$draft" = "true" ]; then gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes; fi
          cat > notes.md <<EOF
          The Windows setup, built from $SHA by the Release workflow. It installs for the current Windows account with no administrator rights. A pre-release: hetu is 0.x and the setup isn't signed, so SmartScreen may warn first

          Check the download against its build:

          \`\`\`
          gh attestation verify hetu-setup-$VERSION-x64.exe --repo $GITHUB_REPOSITORY
          \`\`\`

          or against SHA256SUMS with \`sha256sum -c SHA256SUMS\`
          EOF
          gh release create "$tag" "hetu-setup-$VERSION-x64.exe" SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "hetu $VERSION" --notes-file notes.md --prerelease --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
